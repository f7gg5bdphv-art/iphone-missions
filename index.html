<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>iPhone Mission</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #000000, #151515);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      text-align: center;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a1a1a6;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border: none;
      border-radius: 14px;
      background: #2c2c2e;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      box-shadow: 0 0 0 2px #0a84ff;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #0a84ff;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      color: #ff453a;
      margin-top: 15px;
      display: none;
    }

    .success {
      display: none;
    }

    .mission {
      background: #2c2c2e;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
    }

    .mission h2 {
      margin-bottom: 10px;
    }

    .mission p {
      color: #d1d1d6;
      line-height: 1.5;
    }

    .logout {
      background: #ff453a;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginPage">

      <div class="logo">📱</div>

      <h1>iPhone Mission</h1>

      <p class="subtitle">
        Введи логін та пароль
      </p>

      <input
        type="text"
        id="login"
        placeholder="Логін"
        autocomplete="username"
      >

      <input
        type="password"
        id="password"
        placeholder="Пароль"
        autocomplete="current-password"
      >

      <button onclick="loginUser()">
        Увійти
      </button>

      <p class="error" id="error">
        Неправильний логін або пароль
      </p>

    </div>


    <!-- MAIN PAGE -->
    <div class="card success" id="mainPage">

      <div class="logo">🍎</div>

      <h1>iPhone Mission</h1>

      <p class="subtitle">
        Вітаємо! Ти успішно увійшов.
      </p>

      <div class="mission">
        <h2>🎯 Твоя місія</h2>

        <p>
          Тут буде твій прогрес, завдання
          та підрахунок балів.
        </p>
      </div>

      <div class="mission">
        <h2>🏆 Прогрес</h2>

        <p>
          Бали: <strong id="points">0</strong>
        </p>
      </div>

      <button onclick="addPoint()">
        + Додати бал
      </button>

      <button class="logout" onclick="logoutUser()">
        Вийти
      </button>

    </div>

  </div>


  <script>

    function loginUser() {

      const login = document.getElementById("login").value;
      const password = document.getElementById("password").value;

      /*
        ЛОГІН І ПАРОЛЬ
        Можеш змінити їх тут
      */

      const correctLogin = "iphone";
      const correctPassword = "1234";

      if (
        login === correctLogin &&
        password === correctPassword
      ) {

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("mainPage").style.display = "block";

        document.getElementById("error").style.display = "none";

      } else {

        document.getElementById("error").style.display = "block";

      }
    }


    function addPoint() {

      let points = Number(
        localStorage.getItem("points") || 0
      );

      points++;

      localStorage.setItem("points", points);

      document.getElementById("points").textContent = points;
    }


    function logoutUser() {

      document.getElementById("mainPage").style.display = "none";
      document.getElementById("loginPage").style.display = "block";

      document.getElementById("login").value = "";
      document.getElementById("password").value = "";

    }


    // Показуємо збережені бали
    document.getElementById("points").textContent =
      localStorage.getItem("points") || 0;

  </script>

</body>
</html>
